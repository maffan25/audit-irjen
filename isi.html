<meta name="robots" content="noindex"><meta name="theme-color" content="#0d2a38"><link rel="icon" href="logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="tema.css">
<style>
body{background:var(--bg)}.top{background:var(--n);color:#f6f1de;padding:22px 20px 0;background-image:radial-gradient(60% 80% at 90% 100%,rgba(248,210,74,.22),transparent 70%),radial-gradient(50% 70% at 5% 0%,rgba(20,112,90,.5),transparent 70%)}
.wrap{width:min(680px,100%);margin:auto}.brand{display:flex;gap:12px;align-items:center}.brand img{width:46px;border-radius:26%;box-shadow:0 0 0 2px var(--n),0 0 0 3.5px #d9b872}.brand small{display:block;color:#a9cbc4;font-size:.78rem}.brand b{font-size:.95rem}
.top h1{color:#fff;margin:20px 0 6px;font-size:clamp(1.5rem,6vw,2rem)}.top p{color:#cde0dc;margin:0 0 20px}
.rail{display:flex;gap:4px;padding:0 0 0;margin-top:6px}.rail i{flex:1;height:5px;border-radius:5px 5px 0 0;background:rgba(255,255,255,.18)}.rail i.d{background:var(--g)}
main{padding:22px 16px 90px;max-width:680px;margin:auto}.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,251,239,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--bd);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}.bar .wrap{display:flex;gap:10px}.bar .bt{flex:1}
.hint{color:var(--mu);font-size:.88rem}.kc{border:1.5px solid var(--bd);border-radius:18px;padding:12px;margin-bottom:10px;background:#fff}.kc .kr{grid-template-columns:1fr 1fr 1fr}.kc .kr .kn{grid-column:1/-1}.kc .x{margin-top:8px}
.ring{width:84px;height:104px;margin:0 auto 18px;background:var(--g);border-radius:var(--arch);display:grid;place-items:center;font:700 2.2rem var(--serif);color:var(--n)}
.cd.sum p{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--bd);padding:6px 0;margin:0}.cd.sum span{color:var(--mu)}

.top{position:relative;overflow:hidden}.top::before{content:"";position:absolute;right:-30px;top:-20px;width:150px;height:190px;border-radius:999px 999px 0 0;background:linear-gradient(165deg,rgba(253,227,122,.32),rgba(248,210,74,.04));pointer-events:none}.top .wrap{position:relative}
.brand .gb{margin-left:auto;min-height:38px;padding:0 14px;border-radius:999px;border:1.5px solid rgba(248,210,74,.6);background:rgba(248,210,74,.12);color:var(--g);font-weight:700;font-size:.82rem;cursor:pointer}
.stl{margin:0 0 8px;font-size:.78rem;color:var(--g);font-weight:700;letter-spacing:.05em;text-transform:uppercase;min-height:1.2em}
.rail i{transition:background .4s,transform .4s;transform-origin:bottom}.rail i.d{transform:scaleY(1.5)}
.gd{background:#fff;border:1.5px solid var(--bd);border-radius:20px;margin-bottom:16px;box-shadow:var(--sh);overflow:hidden}.gd summary{list-style:none;display:flex;gap:10px;align-items:center;padding:14px 16px;cursor:pointer}.gd summary::-webkit-details-marker{display:none}.gd summary b{flex:1;font-family:var(--serif);font-size:1rem}.gd summary em{font-style:normal;font-size:.74rem;color:var(--mu)}
.gi{width:28px;height:28px;border-radius:50%;background:var(--g);color:var(--n);display:grid;place-items:center;font-weight:800;flex:none}.gd>p{margin:0;padding:0 16px 10px}.gx{margin:0 16px 16px;padding:12px 14px;border-radius:14px;background:var(--sand);font-size:.88rem;line-height:1.65}
.hw{display:grid;gap:10px;margin-bottom:16px}.hs{display:grid;grid-template-columns:44px 1fr;gap:0 12px;background:#fff;border:1.5px solid var(--bd);border-radius:18px;padding:12px 14px;align-items:center}.hs i{grid-row:1/3;width:44px;height:52px;border-radius:999px 999px 10px 10px;background:linear-gradient(165deg,#fde37a,#f8d24a);display:grid;place-items:center;font:700 1.2rem var(--serif);font-style:normal;color:var(--n)}.hs b{font-family:var(--serif)}.hs span{color:var(--mu);font-size:.86rem}
.kh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.ac{background:var(--sand);border-radius:99px;padding:1px 12px;font-weight:700;font-size:.8rem;transition:background .3s}.kf{display:block}.kf small{display:block;font-size:.75rem;font-weight:600;color:var(--mu);margin:0 0 3px}.kn2{margin-bottom:8px}.kr3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kb{display:flex;gap:10px;align-items:flex-end;margin-top:8px}.kb .kf{flex:1}
@media(max-width:420px){.kr3{grid-template-columns:1fr 1fr}.kr3 .kf:first-child{grid-column:1/-1}}
#m.swap>*{animation:rise .45s cubic-bezier(.2,.7,.2,1) backwards}#m.swap>*:nth-child(2){animation-delay:.05s}#m.swap>*:nth-child(3){animation-delay:.1s}#m.swap>*:nth-child(n+4){animation-delay:.15s}
#gls{position:fixed;inset:0;background:rgba(13,42,56,.6);z-index:70;display:flex;align-items:flex-end;justify-content:center;animation:fade .25s}.gsh{background:var(--bg);width:min(680px,100%);max-height:86vh;overflow:auto;border-radius:28px 28px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:sheet .42s cubic-bezier(.2,.9,.2,1)}.gsh .gd{margin-bottom:10px}
@keyframes fade{from{opacity:0}}@keyframes sheet{from{transform:translateY(100%)}}
.cfw{position:relative;width:84px;height:104px;margin:0 auto 18px}.cfw .ring{margin:0;animation:pop .6s backwards}.ring svg{width:44px;height:44px;fill:none;stroke:var(--n);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:50;stroke-dashoffset:50;animation:dr .5s .35s forwards}@keyframes dr{to{stroke-dashoffset:0}}
.cfw s{position:absolute;left:50%;top:55%;width:8px;height:8px;border-radius:2px;opacity:0;animation:bst .9s .3s ease-out forwards}@keyframes bst{0%{opacity:1;transform:rotate(var(--a)) translateY(0)}100%{opacity:0;transform:rotate(var(--a)) translateY(calc(var(--d)*-1.7)) scale(.5)}}
</style></head><body>
<header class="top"><div class="wrap"><div class="brand"><img src="logo.webp" alt="Kabinet Samasta"><div><b>Kabinet Samasta</b><small>Audit Kinerja Program Kerja</small></div><button class="gb" onclick="gloss()" aria-label="Buka panduan istilah">? Panduan</button></div><h1 id="jd">Memuat…</h1><p id="sb2"></p><p class="stl" id="stl"></p><div class="rail" id="rail"></div></div></header>
<main id="m"></main><div class="bar" id="bar" hidden><div class="wrap"><button class="bt" id="bk">Kembali</button><button class="bt p" id="nx">Lanjut</button></div></div><div id="toast"></div>
<script src="config.js"></script><script src="audit-api.js"></script>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),uid=()=>Math.random().toString(36).slice(2,8);
const P=new URLSearchParams(location.hash.slice(1)),MID=P.get('m')||'',TKN=P.get('k')||'',SK='isi_'+MID;
let INFO=null,ST=0,SID=null,D={},LIST=[];const STEPS=['Program','Tujuan & KPI','Hasil','Bukti'];
try{LIST=JSON.parse(localStorage.getItem(SK+'_l'))||[]}catch(e){}
function toast(m){const d=document.createElement('div');d.textContent=m;$('#toast').append(d);setTimeout(()=>d.remove(),3200)}
const base=()=>({name:'',pic:'',date:'',period:'',type:'',status:'Berjalan',budget:'',obj:'',kr:'',kpis:[{n:'',u:'',t:'',r:'',w:100}],benef:'',outcome:'',evidence:''});
const fl=(l,h,s)=>`<label class="fl"><span>${l}</span>${h}${s?`<small>${s}</small>`:''}</label>`;
const inp=(k,t='text',x='')=>`<input data-k="${k}" type="${t}" value="${E(D[k])}" ${x}>`;
const sld=(k,l,s)=>`<div class="fl"><div class="sc"><span style="font-weight:600;font-size:.85rem">${l}</span><output id="o_${k}">${D[k]}</output><input type="range" min="0" max="100" step="5" data-k="${k}" value="${D[k]}" oninput="$('#o_${k}').value=this.value"><small>${s}</small></div></div>`;
const IN=[['Data dasar program','Ceritakan kegiatan yang sudah atau akan dilaksanakan. Isi apa adanya, tidak perlu menilai diri sendiri.','<b>Contoh:</b> Seminar Literasi Digital · PJ Rani · 10 November 2026 · status Selesai'],
['Tujuan (OKR) dan KPI','Tulis alasan kegiatan ini dibuat (tujuan), lalu angka yang membuktikan hasilnya. Angkanya cukup diambil dari data kegiatan, misalnya daftar hadir atau hasil survei.','<b>Contoh lengkap</b><br>Objective: Meningkatkan literasi digital mahasiswa<br>Key Result: 500 mahasiswa mengikuti pelatihan<br>KPI 1: Jumlah peserta · target 500 · realisasi 430 · bobot 60%<br>KPI 2: Kepuasan peserta (%) · target 90 · realisasi 85 · bobot 40%<br><i>Capaian dihitung otomatis: 430 dari 500 = 86%.</i>'],
['Hasil nyata','Ceritakan siapa yang merasakan manfaatnya dan apa yang berubah setelah kegiatan, bukan hanya acaranya berlangsung.','<b>Contoh:</b> 80 mahasiswa ikut. Setelah seminar, peserta bisa membedakan berita hoaks dan membuat 12 konten edukasi.'],
['Bukti pendukung','Bukti membuat Irjen bisa memeriksa isianmu dengan cepat. Tempel tautan atau tulis nama dokumennya, satu per baris.','<b>Contoh:</b><br>LPJ: tautan Google Drive<br>Dokumentasi: tautan folder foto<br>Daftar hadir: tautan spreadsheet']];
const intro=s=>`<details class="gd" open><summary><span class="gi">?</span><b>${IN[s][0]}</b><em>Bantuan</em></summary><p>${IN[s][1]}</p><div class="gx">${IN[s][2]}</div></details>`;
const GL=[['Program kerja (proker)','Satu kegiatan atau program yang dijalankan kementerian, misalnya seminar, pelatihan, atau pengabdian masyarakat.'],['OKR','Singkatan Objective and Key Results: cara menuliskan tujuan beserta hasil terukurnya.'],['Objective (tujuan)','Tujuan besar yang ingin dicapai, ditulis sebagai kalimat. Contoh: meningkatkan literasi digital mahasiswa.'],['Key Result (hasil kunci)','Hasil terukur yang menandakan tujuan tercapai. Contoh: 500 mahasiswa mengikuti pelatihan.'],['KPI','Key Performance Indicator: angka yang dipakai mengukur keberhasilan program, misalnya jumlah peserta atau persentase kepuasan.'],['Target','Angka yang direncanakan sebelum kegiatan berlangsung.'],['Realisasi','Angka yang benar-benar tercapai setelah kegiatan. Boleh lebih kecil atau lebih besar dari target.'],['Capaian','Realisasi dibagi target. Target 500 dan realisasi 430 berarti capaian 86%. Dihitung otomatis.'],['Bobot','Tingkat kepentingan sebuah KPI. KPI yang paling penting diberi bobot lebih besar. Jumlah semua bobot harus 100%.'],['Penerima manfaat','Orang yang merasakan manfaat langsung dari program, misalnya peserta atau warga sasaran.'],['Outcome (hasil dan dampak)','Perubahan yang terjadi setelah kegiatan, bukan sekadar kegiatannya berlangsung.'],['Bukti','Dokumen yang membuktikan isianmu: LPJ, foto dokumentasi, daftar hadir, atau tautan unggahan.'],['Siapa yang menilai?','Kamu tidak perlu menilai diri sendiri. Inspektorat Jenderal (Irjen) memeriksa bukti lalu memberi nilai.']];
function gloss(){if($('#gls'))return;const d=document.createElement('div');d.id='gls';d.innerHTML='<div class="gsh"><div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><h2 style="margin:0;flex:1">Panduan istilah</h2><button class="bt s" onclick="glx()">Tutup</button></div><p class="hint" style="margin-bottom:12px">Ketuk istilah untuk melihat artinya.</p>'+GL.map(g=>'<details class="gd"><summary><span class="gi">i</span><b>'+g[0]+'</b></summary><p>'+g[1]+'</p></details>').join('')+'</div>';d.onclick=e=>{if(e.target==d)glx()};document.body.append(d);document.body.style.overflow='hidden'}
function glx(){const d=$('#gls');if(d){d.remove();document.body.style.overflow=''}}
function swap(){const m=$('#m');m.classList.remove('swap');void m.offsetWidth;m.classList.add('swap')}
async function init(){
  if(!MID||!TKN)return fail('Tautan tidak lengkap','Pindai ulang barcode dari kementerianmu, atau minta tautan baru kepada admin.');
  const r=await AUDIT.api('info',{mid:MID,tk:TKN});
  if(!r.ok){if(AUDIT.uji())return fail('Server audit belum tersambung','Admin perlu mengisi sambungan server di config.js agar barcode bisa dipakai dari perangkat lain.');return fail(r.error=='jaringan'?'Server tidak terjangkau':'Barcode tidak berlaku',r.error=='jaringan'?'Periksa koneksi internet lalu muat ulang halaman.':r.error=='tunggu'?'Terlalu banyak percobaan. Coba lagi beberapa menit lagi.':'Barcode ini sudah diganti, atau admin belum membuka menu Barcode setelah menambah kementerian. Hubungi admin.')}
  INFO=r;$('#jd').textContent=r.nama;home()}
function fail(t,s){$('#jd').textContent=t;$('#sb2').textContent=s;$('#m').innerHTML='';$('#bar').hidden=true}
function rail(){$('#rail').innerHTML=STEPS.map((_,i)=>`<i class="${i<=ST?'d':''}"></i>`).join('');$('#stl').textContent=ST>=0&&ST<STEPS.length?'Langkah '+(ST+1)+' dari '+STEPS.length+' · '+STEPS[ST]:''}
/* ---- beranda: daftar isian ---- */
async function home(){ST=-1;rail();$('#bar').hidden=true;$('#sb2').textContent='Kepala: '+(INFO.kepala||'-')+(INFO.periode?' · Periode '+INFO.periode:'');
  $('#m').innerHTML='<div class="hw"><div class="hs"><i>1</i><b>Isi informasi</b><span>Data program, angka KPI, dan bukti dalam 4 langkah singkat.</span></div><div class="hs"><i>2</i><b>Irjen menilai</b><span>Inspektorat Jenderal memeriksa bukti lalu memberi nilai.</span></div><div class="hs"><i>3</i><b>Pantau status</b><span>Buka barcode ini lagi untuk melihat status dan catatan Irjen.</span></div></div><details class="gd"><summary><span class="gi">✓</span><b>Siapkan dulu sebelum mengisi</b></summary><div class="gx">• Nama, tanggal, dan penanggung jawab kegiatan<br>• Angka target dan realisasi (dari daftar hadir, survei, atau laporan)<br>• Tautan LPJ, foto dokumentasi, atau daftar hadir</div></details><div class="cd" style="text-align:center"><h3>Tambah program kerja</h3><p class="hint">Isi satu program kerja per formulir, cukup informasi tanpa penilaian. Butuh sekitar 5 menit. Jawaban tersimpan otomatis sebagai draf.</p><button class="bt p" onclick="baru()">Isi program kerja baru</button></div><div id="ls"></div>';swap();
  if(LIST.length){const r=await AUDIT.api('status',{mid:MID,tk:TKN,sids:LIST.map(x=>x.sid)});const S={};(r.data||[]).forEach(x=>S[x.sid]=x);
    const lb={menunggu:['Menunggu audit',2],revisi:['Perlu revisi',3],sah:['Disahkan',0]};
    $('#ls').innerHTML='<h3 style="margin:22px 0 10px">Isian yang sudah dikirim</h3>'+LIST.map(x=>{const s=S[x.sid]||{},a=lb[s.aud];return`<div class="cd" style="margin-bottom:10px"><div style="display:flex;gap:10px;justify-content:space-between;align-items:center"><b>${E(x.name)}</b>${a?`<span class="b f${a[1]}">${a[0]}</span>`:''}</div>${s.cat?`<div class="wn" style="margin-top:10px"><b>Catatan admin:</b> ${E(s.cat)}</div>`:''}${s.aud=='revisi'&&s.data?`<button class="bt s p" style="margin-top:10px" onclick="revisi('${x.sid}')">Perbaiki isian</button>`:''}</div>`}).join('');window._S=S}
  const dr=localStorage.getItem(SK+'_d');if(dr)$('#m').insertAdjacentHTML('afterbegin','<div class="wn">Ada draf yang belum dikirim. <button class="bt s" onclick="baru(1)">Lanjutkan draf</button></div>')}
function baru(lanjut){SID=null;D=base();if(lanjut){try{D=Object.assign(base(),JSON.parse(localStorage.getItem(SK+'_d')))}catch(e){}}form()}
function revisi(sid){const s=(window._S||{})[sid];if(!s||!s.data)return;SID=sid;D=Object.assign(base(),s.data);form()}
/* ---- formulir bertahap ---- */
function form(){ST=0;$('#bar').hidden=false;$('#sb2').textContent=SID?'Perbaiki isian sesuai catatan admin':'Isi informasi sesuai kenyataan. Penilaian dilakukan oleh Inspektorat Jenderal.';draw()}
function draw(){rail();const s=ST,h=[];
  if(s==0)h.push(fl('Nama program kerja *',inp('name'),'Nama kegiatannya, contoh: Seminar Literasi Digital.'),fl('Penanggung jawab *',inp('pic'),'Orang yang bertanggung jawab atas kegiatan ini.'),fl('Tanggal pelaksanaan *',inp('date','date'),'Tanggal kegiatan dilaksanakan (atau mulai dilaksanakan).'),fl('Periode (bulan)',inp('period','month')),fl('Jenis program kerja',inp('type','text','placeholder="Contoh: Seminar, Pengabdian, Advokasi"')),fl('Status *',`<select data-k="status">${['Selesai','Berjalan','Belum dimulai','Tidak terlaksana','Dibatalkan'].map(x=>`<option ${D.status==x?'selected':''}>${x}</option>`).join('')}</select>`,'Selesai: sudah terlaksana. Berjalan: sedang berlangsung. Belum dimulai: masih rencana. Tidak terlaksana atau Dibatalkan: tidak jadi dilaksanakan.'),fl('Anggaran terpakai (Rp)',inp('budget','number','min=0 inputmode="numeric"'),'Uang yang benar-benar terpakai, dalam rupiah. Kosongkan bila tanpa biaya.'));
  if(s==1)h.push(fl('Tujuan program (Objective) *',inp('obj','text','placeholder="Contoh: Meningkatkan keterlibatan mahasiswa"'),'Tujuan besar program: apa yang ingin diubah atau dicapai.'),fl('Hasil kunci (Key Result)',inp('kr'),'Hasil terukur penanda tujuan tercapai. Contoh: 500 mahasiswa mengikuti pelatihan.'),'<h3 style="margin-top:18px">Indikator keberhasilan (KPI)</h3><p class="hint">KPI adalah angka pengukur keberhasilan. Isi <b>target</b> (rencana) dan <b>realisasi</b> (kenyataan). Total bobot semua KPI harus 100%.</p><div id="kl">'+D.kpis.map(kpi).join('')+'</div><button class="bt s" onclick="addK()">Tambah KPI</button><p id="kw" style="margin-top:8px"></p>');
  if(s==2)h.push('<p class="hint">Cukup isi informasi apa adanya. Penilaian dilakukan oleh Inspektorat Jenderal.</p>',fl('Jumlah penerima manfaat',inp('benef','number','min=0 inputmode="numeric"'),'Jumlah orang yang merasakan manfaat langsung, misalnya jumlah peserta.'),fl('Hasil dan dampak yang terjadi','<textarea data-k="outcome" placeholder="Ceritakan apa yang berhasil dicapai dan perubahan yang dirasakan penerima manfaat">'+E(D.outcome)+'</textarea>'));
  if(s==3)h.push(fl('Bukti pendukung','<textarea data-k="evidence" placeholder="Satu tautan atau nama dokumen per baris&#10;LPJ: https://…&#10;Dokumentasi: https://…">'+E(D.evidence)+'</textarea>','Wajib bila status Selesai atau Berjalan.'),'<div class="cd sum" id="rv"></div>');
  $('#m').innerHTML=intro(s)+h.join('')+'<div class="er" id="er"></div>';swap();$('#m').dataset.s=s;if(s==1)kwt();if(s==3)review();
  $('#bk').textContent=s==0?'Batal':'Kembali';$('#nx').textContent=s==3?'Kirim isian':'Lanjut';scrollTo(0,0)}
const kpi=(k,i)=>`<div class="kc"><div class="kh"><b>KPI ${i+1}</b><span class="ac" title="Realisasi dibanding target">Capaian 0%</span></div><label class="kf kn2"><small>Nama KPI</small><input class="kn" placeholder="Contoh: Jumlah peserta" value="${E(k.n)}"></label><div class="kr3"><label class="kf"><small>Satuan</small><input class="ku" placeholder="orang, %, kali" value="${E(k.u)}"></label><label class="kf"><small>Target (rencana)</small><input class="kt" type="number" min="0" inputmode="decimal" placeholder="500" value="${k.t}" oninput="kwt()"></label><label class="kf"><small>Realisasi (tercapai)</small><input class="kv" type="number" min="0" inputmode="decimal" placeholder="430" value="${k.r}" oninput="kwt()"></label></div><div class="kb"><label class="kf"><small>Bobot KPI (%)</small><input class="kw" type="number" min="0" max="100" inputmode="numeric" placeholder="60" value="${k.w}" oninput="kwt()"></label><button class="bt s r" onclick="this.closest('.kc').remove();kwt()">Hapus</button></div></div>`;
function addK(){grab();D.kpis.push({n:'',u:'',t:'',r:'',w:''});draw()}
function kwt(){const t=[...document.querySelectorAll('.kw')].reduce((a,i)=>a+(+i.value||0),0),e=$('#kw');if(e)e.innerHTML=`Total bobot: <b style="color:var(--c${t==100?0:4})">${t}%</b>${t==100?' ✓':' (harus 100%)'}`;
  document.querySelectorAll('.kc').forEach(c=>{const T=+c.querySelector('.kt').value,Rr=+c.querySelector('.kv').value,a=c.querySelector('.ac');if(!a)return;const p=T>0?Math.round(Rr/T*100):0;a.textContent='Capaian '+p+'%';a.style.background=p>=100?'#cfe9df':p>=70?'#e8f1c9':'var(--sand)'})}
function star(n){D.sat=n;document.querySelectorAll('.stk button').forEach((b,i)=>b.classList.toggle('on',i<n))}
function grab(){document.querySelectorAll('[data-k]').forEach(e=>{D[e.dataset.k]=e.type=='range'||e.type=='number'&&['okr','time','qual','adm','impact'].includes(e.dataset.k)?+e.value:e.value.trim?e.value.trim():e.value});
  if(document.querySelector('.kc'))D.kpis=[...document.querySelectorAll('.kc')].map(r=>({n:r.querySelector('.kn').value.trim(),u:r.querySelector('.ku').value.trim(),t:r.querySelector('.kt').value,r:r.querySelector('.kv').value,w:r.querySelector('.kw').value}));
  try{if(!SID)localStorage.setItem(SK+'_d',JSON.stringify(D))}catch(e){}}
function check(s){const e=[];
  if(s==0){if(!D.name)e.push('Nama program kerja wajib diisi.');if(!D.pic)e.push('Penanggung jawab wajib diisi.');if(!D.date)e.push('Tanggal pelaksanaan wajib diisi.')}
  if(s==1){if(!D.obj)e.push('Tujuan program wajib diisi.');const k=D.kpis;if(!k.length)e.push('Tambahkan minimal satu KPI.');k.forEach((x,i)=>{if(!x.n||x.t===''||x.r===''||x.w==='')e.push('KPI '+(i+1)+': nama, target, realisasi, dan bobot wajib diisi.');else if(!(+x.t>0))e.push('KPI '+(i+1)+': target harus lebih dari 0.')});if(k.reduce((a,x)=>a+(+x.w||0),0)!=100)e.push('Total bobot KPI harus tepat 100%.')}
  if(s==3&&['Selesai','Berjalan'].includes(D.status)&&!D.evidence)e.push('Status '+D.status+' wajib menyertakan bukti (tautan atau nama dokumen).');return e}
function review(){$('#rv').innerHTML=`<h3>Periksa sebelum mengirim</h3>${[['Program',D.name],['Penanggung jawab',D.pic],['Status',D.status],['KPI',D.kpis.length+' indikator'],['Penerima manfaat',D.benef||0]].map(([a,b])=>`<p><span>${a}</span><b>${E(b)}</b></p>`).join('')}`}
$('#bk').onclick=()=>{grab();if(ST==0){if(confirm('Keluar dari formulir? Draf tetap tersimpan.'))home()}else{ST--;draw()}};
$('#nx').onclick=async()=>{grab();const e=check(ST);if(e.length)return $('#er').innerHTML=e.map(x=>'• '+E(x)).join('<br>');
  if(ST<3){ST++;return draw()}
  const b=$('#nx');b.disabled=true;b.textContent='Mengirim…';
  const r=await AUDIT.api('kirim',{mid:MID,tk:TKN,sid:SID,data:Object.assign({},D,{kpis:D.kpis.map(k=>({n:k.n,u:k.u,t:+k.t,r:+k.r,w:+k.w}))})});b.disabled=false;
  if(!r.ok){b.textContent='Kirim isian';return $('#er').textContent=r.error=='jaringan'?'Koneksi gagal. Isian belum terkirim, coba lagi.':r.error=='terkunci'?'Isian ini sudah disahkan dan tidak bisa diubah.':'Isian ditolak server ('+r.error+'). Periksa data lalu coba lagi.'}
  if(!LIST.some(x=>x.sid==r.sid))LIST.unshift({sid:r.sid,name:D.name});try{localStorage.setItem(SK+'_l',JSON.stringify(LIST));if(!SID)localStorage.removeItem(SK+'_d')}catch(e){}
  $('#bar').hidden=true;ST=5;rail();$('#sb2').textContent='';$('#m').innerHTML=`<div class="cd" style="text-align:center"><div class="cfw"><div class="ring"><svg viewBox="0 0 52 52"><path d="M14 27l8 8 16-17"/></svg></div>${Array.from({length:14},(_,i)=>`<s style="--a:${i*26}deg;--d:${48+i%3*16}px;background:${['#f8d24a','#14705a','#e8742a'][i%3]}"></s>`).join('')}</div><h2>Isian terkirim</h2><p>Terima kasih. Inspektorat Jenderal akan memeriksa dan menilai isian <b>${E(D.name)}</b>. Buka kembali barcode ini untuk melihat status audit atau catatan revisi.</p><button class="bt p" onclick="home()">Kembali ke beranda</button></div>`};
init();
</script></body></html>
