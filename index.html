<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Sistem Penilaian Kinerja Kabinet Samasta</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="tema.css"><link rel="icon" href="logo.webp"><meta name="theme-color" content="#0d2a38"></head><body>
<div id="login" hidden><div class="lc"><img class="lg" alt="Logo Kabinet Samasta"><h2 style="margin-top:14px">Sistem Penilaian Kinerja</h2><p style="color:var(--mu)">Khusus admin Kabinet Samasta</p><input id="code" type="password" inputmode="numeric" autocomplete="off" placeholder="Kode akses" aria-label="Kode akses"><div class="er" id="er"></div><button class="bt p" style="width:100%" onclick="login()">Masuk</button></div></div>
<div class="app" id="app" hidden><aside id="sb"><img class="lg" alt="Kabinet Samasta"><div class="bn">Kabinet Samasta<small>Audit Kinerja</small></div><div id="nv"></div></aside><div><header class="tb"><button class="bt s" onclick="$('#sb').classList.toggle('o')" aria-label="Menu">☰</button><input id="gs" placeholder="Cari kementerian, proker, KPI…" aria-label="Cari"></header><main id="main"></main></div></div>
<div id="dlg" hidden></div><div id="toast"></div><div id="rpt"></div>
<script>
const LOGO='logo.webp',HASH='a78d2c201282f6ecf7c28f86d7e94e65a046214b047dd1f5b890c5a1a855950a';
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),N=(v,d=1)=>(+v||0).toFixed(d).replace('.',','),cl=(x,a=0,b=100)=>Math.min(b,Math.max(a,x)),uid=()=>Math.random().toString(36).slice(2,9);
const IC={dash:'<rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/>',min:'<path d="M4 21V8l8-5 8 5v13M9 21v-6h6v6"/>',prk:'<path d="M8 4h8v3H8zM6 5H5v16h14V5h-1M9 12h6M9 16h6"/>',add:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',ana:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',rank:'<path d="M7 21v-8h4v8M13 21V8h4v13M1 21v-5h4v5"/>',rep:'<path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h6M9 17h6"/>',set:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',log:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',out:'<path d="M9 4H4v16h5M16 8l4 4-4 4M20 12H9"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24">${IC[n]}</svg>`;
const NAV=[['dash','Dashboard'],['min','Kementerian'],['prk','Program Kerja'],['add','Input Penilaian'],['ana','Analitik'],['rank','Ranking'],['rep','Laporan'],['set','Pengaturan'],['log','Audit Log']];
// ---------- data ----------
const K='samasta_v1';let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{m:[],p:[],cfg:{wc:30,we:40,wi:30,ex:{kpi:30,tvr:15,time:20,qual:20,adm:15},cap:100,periode:''},log:[]};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Penyimpanan browser gagal','!')}};
const lg=a=>{S.log.unshift({t:Date.now(),a});S.log=S.log.slice(0,300);save()};
function toast(m){const d=document.createElement('div');d.textContent=m;$('#toast').append(d);setTimeout(()=>d.remove(),3200)}
function dlg(h){$('#dlg').innerHTML='<div>'+h+'</div>';$('#dlg').hidden=false}const cd=()=>$('#dlg').hidden=true;
const ask=m=>new Promise(r=>{window._r=v=>{cd();r(v)};dlg(`<h3>Konfirmasi</h3><p>${m}</p><div class="fb" style="margin-top:14px"><button class="bt" onclick="_r(0)">Batal</button><button class="bt p" onclick="_r(1)">Ya, lanjutkan</button></div>`)});
let AU=0;try{AU=sessionStorage.getItem('au')=='1'}catch(e){}
function sha256(s){const r=(n,x)=>x>>>n|x<<32-n,K=[],H=[];let p=0,c=0;for(;p<64;c++){let ok=1;for(let i=2;i*i<=c;i++)if(c%i==0)ok=0;if(c>1&&ok){K[p]=(Math.cbrt(c)%1)*4294967296|0;if(p<8)H[p]=(Math.sqrt(c)%1)*4294967296|0;p++}}
const b=[...new TextEncoder().encode(s)],l=b.length*8;b.push(128);while(b.length%64!=56)b.push(0);for(let i=7;i>=0;i--)b.push(i>3?0:l>>>i*8&255);
for(let o=0;o<b.length;o+=64){const w=[];for(let i=0;i<64;i++)w[i]=i<16?b[o+4*i]<<24|b[o+4*i+1]<<16|b[o+4*i+2]<<8|b[o+4*i+3]:(r(17,w[i-2])^r(19,w[i-2])^w[i-2]>>>10)+w[i-7]+(r(7,w[i-15])^r(18,w[i-15])^w[i-15]>>>3)+w[i-16]|0;let[a,B,C,D,e,f,g,h]=H;for(let i=0;i<64;i++){const t=h+(r(6,e)^r(11,e)^r(25,e))+(e&f^~e&g)+K[i]+w[i]|0,u=(r(2,a)^r(13,a)^r(22,a))+(a&B^a&C^B&C)|0;h=g;g=f;f=e;e=D+t|0;D=C;C=B;B=a;a=t+u|0}[a,B,C,D,e,f,g,h].forEach((v,i)=>H[i]=H[i]+v|0)}
return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('')}
async function login(){const v=$('#code').value.trim();let h;try{h=[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)))].map(b=>b.toString(16).padStart(2,'0')).join('')}catch(e){h=sha256(v)}if(h===HASH){AU=1;try{sessionStorage.setItem('au','1')}catch(e){}lg('Login admin');location.hash='dash';boot()}else $('#er').textContent='Kode akses salah. Periksa kembali lalu coba lagi.'}
function logout(){AU=0;try{sessionStorage.removeItem('au')}catch(e){}lg('Logout');boot()}
// ---------- scoring ----------
const ach=k=>k.t>0?cl(k.r/k.t*100,0,S.cfg.cap):0;
function sc(p){const c=S.cfg,e=c.ex,ks=p.kpis||[],tw=ks.reduce((a,k)=>a+k.w,0)||1;
const kpi=ks.length?ks.reduce((a,k)=>a+ach(k)*k.w,0)/tw:0,tvr=ks.length?ks.reduce((a,k)=>a+ach(k),0)/ks.length:0;
const comp=p.status=='Selesai'?100:p.status=='Berjalan'?50:0,ex=(kpi*e.kpi+tvr*e.tvr+p.time*e.time+p.qual*e.qual+p.adm*e.adm)/100,sat=p.sat/5*100,is=(p.impact+sat)/2;
return{comp,kpi,tvr,time:p.time,qual:p.qual,adm:p.adm,ex,imp:p.impact,sat,is,okr:p.okr,fin:cl((comp*c.wc+ex*c.we+is*c.wi)/100)}}
const KEYS=['comp','kpi','tvr','time','qual','adm','ex','imp','sat','is','okr','fin'];
function agg(ps){const o={n:ps.length},W=ps.reduce((a,p)=>a+p.weight,0)||1,sp=ps.map(p=>[sc(p),p.weight]);KEYS.forEach(k=>o[k]=sp.reduce((a,[s,w])=>a+s[k]*w,0)/W);const c=s=>ps.filter(p=>p.status==s).length;o.done=c('Selesai');o.run=c('Berjalan');o.todo=c('Belum dimulai');o.fail=c('Tidak terlaksana')+c('Dibatalkan');o.ben=ps.reduce((a,p)=>a+p.benef,0);o.bud=ps.reduce((a,p)=>a+p.budget,0);return o}
const li=v=>v>=85?0:v>=75?1:v>=60?2:v>=40?3:4,LB=['Sangat Baik','Baik','Cukup','Kurang','Sangat Kurang'],bd=v=>`<span class="b f${li(v)}">${LB[li(v)]}</span>`;
const SF={'Selesai':0,'Berjalan':1,'Belum dimulai':5,'Tidak terlaksana':4,'Dibatalkan':3},sb=s=>`<span class="b f${SF[s]}">${s}</span>`;
const DIM={comp:'penyelesaian proker',kpi:'pencapaian KPI',time:'ketepatan waktu',qual:'kualitas pelaksanaan',adm:'kelengkapan administrasi',imp:'dampak program',sat:'kepuasan penerima manfaat'};
const REC={comp:'Perkuat monitoring proker dan tindak lanjuti proker yang belum berjalan.',kpi:'Evaluasi kewajaran target KPI dan strategi pelaksanaannya.',time:'Perkuat monitoring timeline dengan milestone dan pengingat berkala.',qual:'Tetapkan standar kualitas dan lakukan evaluasi internal sebelum acara berakhir.',adm:'Perbaiki dokumentasi: gunakan checklist administrasi dan tenggat LPJ maksimal H+7.',imp:'Perbaiki desain program agar menghasilkan dampak yang lebih nyata dan berkelanjutan.',sat:'Perbaiki pelayanan dan sesuaikan program dengan kebutuhan peserta.'};
function nar(a,nm){if(!a.n)return null;const ks=Object.keys(DIM).map(k=>[k,a[k]]).sort((x,y)=>y[1]-x[1]),top=ks.slice(0,2),low=ks.filter(x=>x[1]<75).reverse().slice(0,3);
return{t:`${nm} memperoleh nilai akhir ${N(a.fin)} (${LB[li(a.fin)]}). Penyelesaian ${N(a.comp,0)}%, pelaksanaan ${N(a.ex,0)}%, dampak ${N(a.imp,0)}%, kepuasan ${N(a.sat,0)}%. Kekuatan utama: ${DIM[top[0][0]]} (${N(top[0][1],0)}) dan ${DIM[top[1][0]]} (${N(top[1][1],0)}). `+(low.length?`Area perbaikan: ${low.map(x=>DIM[x[0]]+' ('+N(x[1],0)+')').join(', ')}.`:'Seluruh indikator berada di atas 75.'),r:low.map(x=>REC[x[0]])}}
const narH=n=>n?`<p>${n.t}</p>${n.r.length?'<b>Rekomendasi:</b><ol>'+n.r.map(r=>`<li>${r}</li>`).join('')+'</ol>':''}`:'';
function warns(p){const w=[];if(['Selesai','Berjalan'].includes(p.status)&&!p.evidence)w.push('Belum ada bukti (proposal, LPJ, dokumentasi, absensi, survei).');if(p.status=='Selesai'&&p.adm<60)w.push('Kelengkapan administrasi rendah ('+p.adm+').');if(p.status=='Selesai'&&p.time<60)w.push('Ketepatan waktu rendah ('+p.time+').');return w}
// ---------- UI helpers ----------
const empty=t=>`<div class="em">${t}</div>`,bar=(v,l)=>`<div class="br"><div class="bl"><span>${l}</span><b>${N(v,0)}%</b></div><div class="tk"><i class="f${li(v)}" style="width:${cl(v)}%"></i></div></div>`;
const card=(v,l,h)=>`<div class="cd kp ${h?'h':''}" style="--l:${Math.max(String(v).length,4)}"><b>${v}</b><span>${l}</span></div>`;
function donut(ps){const t=ps.reduce((a,x)=>a+x.v,0);if(!t)return empty('Belum ada data');let o=0;const C=2*Math.PI*40;return`<div class="dn"><svg viewBox="0 0 120 120" width="140">${ps.map(x=>{const d=x.v/t*C,e=`<circle cx="60" cy="60" r="40" fill="none" stroke="${x.c}" stroke-width="18" stroke-dasharray="${d} ${C-d}" stroke-dashoffset="${-o}" transform="rotate(-90 60 60)"/>`;o+=d;return e}).join('')}<text x="60" y="66" text-anchor="middle" class="tx" font-size="20" font-weight="700">${t}</text></svg><ul>${ps.map(x=>`<li><i style="background:${x.c}"></i>${x.l}: <b>${x.v}</b></li>`).join('')}</ul></div>`}
function radar(L,V){const n=L.length,pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[110+Math.cos(a)*70*v/100,100+Math.sin(a)*70*v/100]};return`<svg viewBox="0 0 220 205" class="rd">${[25,50,75,100].map(k=>`<polygon points="${L.map((_,i)=>pt(i,k)).join(' ')}" fill="none" stroke="var(--bd)"/>`).join('')}${L.map((l,i)=>{const[x,y]=pt(i,120);return`<text x="${x}" y="${y}" text-anchor="middle" font-size="9" class="tx">${l}</text>`}).join('')}<polygon points="${V.map((v,i)=>pt(i,v)).join(' ')}" fill="rgba(15,107,90,.28)" stroke="var(--t)" stroke-width="2"/></svg>`}
function line(pts){if(pts.length<2)return empty('Butuh data dari minimal 2 periode (bulan) berbeda.');const n=pts.length,x=i=>25+i*(255/(n-1)),y=v=>105-v*.9;return`<svg viewBox="0 0 300 130">${[0,50,100].map(v=>`<line x1="25" x2="285" y1="${y(v)}" y2="${y(v)}" stroke="var(--bd)"/><text x="2" y="${y(v)+3}" font-size="8" class="tx">${v}</text>`).join('')}<polyline fill="none" stroke="var(--t)" stroke-width="2.5" points="${pts.map((p,i)=>x(i)+','+y(p[1])).join(' ')}"/>${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p[1])}" r="3.5" fill="var(--g)"/><text x="${x(i)}" y="124" font-size="8" text-anchor="middle" class="tx">${p[0]}</text>`).join('')}</svg>`}
const HC=[['comp','Completion'],['kpi','KPI'],['time','Waktu'],['qual','Kualitas'],['adm','Admin'],['imp','Impact'],['sat','Kepuasan'],['okr','OKR']];
const heat=rows=>rows.length?`<div class="ov"><table><tr><th>Kementerian</th>${HC.map(c=>`<th>${c[1]}</th>`).join('')}</tr>${rows.map(([m,a])=>`<tr><td>${E(m.name)}</td>${HC.map(c=>`<td style="background:var(--c${li(a[c[0]])});color:${li(a[c[0]])==2?'#222':'#fff'};text-align:center;font-weight:700">${N(a[c[0]],0)}</td>`).join('')}</tr>`).join('')}</table></div>`:empty('Belum ada data');
const tbl=ps=>ps.length?`<div class="ov"><table><tr><th>Program kerja</th><th>Kementerian</th><th>Penanggung jawab</th><th>Status</th><th>Nilai</th></tr>${ps.map(p=>{const s=sc(p).fin;return`<tr class="cl" onclick="go('prk/${p.id}')"><td><b>${E(p.name)}</b></td><td>${E(mn(p.mid))}</td><td>${E(p.pic)}</td><td>${sb(p.status)}</td><td>${N(s)} ${bd(s)}</td></tr>`}).join('')}</table></div>`:empty('Tidak ada proker yang cocok.');
const mn=id=>(S.m.find(m=>m.id==id)||{name:'-'}).name,go=h=>{if(location.hash=='#'+h)R();else location.hash=h},pm=id=>S.p.filter(p=>p.mid==id);
const opt=(a,v,all)=>(all?`<option value="">${all}</option>`:'')+a.map(x=>{const[val,l]=Array.isArray(x)?x:[x,x];return`<option value="${E(val)}" ${String(val)===String(v)?'selected':''}>${E(l)}</option>`}).join('');
// ---------- pages ----------
let F={per:'',mid:'',st:'',type:'',lvl:'',obj:''},Q='';
const uq=k=>[...new Set(S.p.map(p=>p[k]).filter(Boolean))];
const fp=()=>S.p.filter(p=>(!F.per||p.period==F.per)&&(!F.mid||p.mid==F.mid)&&(!F.st||p.status==F.st)&&(!F.type||p.type==F.type)&&(!F.obj||p.obj==F.obj)&&(F.lvl===''||li(sc(p).fin)==F.lvl));
const sf=(k,v)=>{F[k]=v;R(1)};
function P_dash(){const ps=fp(),a=agg(ps),ms=S.m.filter(m=>!F.mid||m.id==F.mid).map(m=>[m,agg(ps.filter(p=>p.mid==m.id))]).filter(x=>x[1].n);
const head=`<div class="hd"><img src="${LOGO}" alt=""><div><h1>Sistem Penilaian Kinerja Kabinet Samasta</h1><p>Dashboard Evaluasi Program Kerja dan Kinerja Kementerian</p></div></div>`;
if(!S.m.length)return head+empty(`<h3>Belum ada data</h3><p>Mulai dengan menambahkan kementerian, lalu input program kerja beserta KPI-nya. Semua nilai dihitung otomatis dari data yang Anda masukkan.</p><p><button class="bt p" onclick="go('min')">Tambah kementerian</button></p>`);
const fb=`<div class="fb"><select onchange="sf('per',this.value)" aria-label="Periode">${opt(uq('period'),F.per,'Semua periode')}</select><select onchange="sf('mid',this.value)">${opt(S.m.map(m=>[m.id,m.name]),F.mid,'Semua kementerian')}</select><select onchange="sf('st',this.value)">${opt(Object.keys(SF),F.st,'Semua status')}</select><select onchange="sf('type',this.value)">${opt(uq('type'),F.type,'Semua jenis')}</select><select onchange="sf('lvl',this.value)">${opt(LB.map((l,i)=>[i,l]),F.lvl,'Semua tingkat nilai')}</select><select onchange="sf('obj',this.value)">${opt(uq('obj'),F.obj,'Semua Objective/OKR')}</select></div>`;
if(!ps.length)return head+fb+empty(S.p.length?'Tidak ada proker yang cocok dengan filter.':`<h3>Belum ada program kerja</h3><p><button class="bt p" onclick="go('add')">Input penilaian pertama</button></p>`);
const per={};ps.forEach(p=>{if(p.period)(per[p.period]=per[p.period]||[]).push(p)});const pts=Object.keys(per).sort().map(k=>[k,agg(per[k]).fin]);
return head+fb+`<div class="gr gs">${card(N(a.fin),'Overall Score · '+LB[li(a.fin)],1)}${card(N(a.done/a.n*100,0)+'%','Completion Rate (proker selesai)')}${card(a.n,'Total Proker')}${card(a.done,'Proker Selesai')}${card(ms.length+'/'+S.m.length,'Kementerian Dinilai')}${card(a.ben.toLocaleString('id-ID'),'Penerima Manfaat')}</div>
<div class="gr gs" style="margin-top:14px">${card(N(a.ex,0)+'%','Execution')}${card(N(a.imp,0)+'%','Impact')}${card(N(a.sat,0)+'%','Satisfaction')}${card(N(a.okr,0)+'%','Strategic Alignment')}${card(a.run+' / '+a.fail,'Berjalan / Tidak terlaksana')}${card('Rp'+a.bud.toLocaleString('id-ID'),'Total Anggaran')}</div>
<div class="gr" style="margin-top:14px"><div class="cd"><h3>Nilai Kementerian</h3>${ms.sort((x,y)=>y[1].fin-x[1].fin).map(([m,x])=>bar(x.fin,E(m.name))).join('')}</div><div class="cd"><h3>Status Proker</h3>${donut([{l:'Selesai',v:a.done,c:'#1E8E5A'},{l:'Berjalan',v:a.run,c:'#E0A800'},{l:'Belum dimulai',v:a.todo,c:'#8a979b'},{l:'Tidak terlaksana',v:a.fail,c:'#C93A3A'}])}</div><div class="cd"><h3>Profil Indikator</h3>${radar(['Completion','Execution','Impact','Kepuasan','OKR'],[a.comp,a.ex,a.imp,a.sat,a.okr])}</div><div class="cd"><h3>Perkembangan per Periode</h3>${line(pts)}</div><div class="cd"><h3>Target vs Realisasi (pencapaian KPI)</h3>${ms.map(([m,x])=>bar(x.tvr,E(m.name))).join('')}</div><div class="cd"><h3>Ranking Kementerian</h3>${rkT(ms.map(([m,x])=>[m.name,x.fin,'min/'+m.id]))}</div></div>
<div class="cd" style="margin-top:14px"><h3>Heatmap Indikator</h3>${heat(ms)}</div>`}
const rkT=r=>r.length?`<div class="ov"><table>${r.sort((x,y)=>y[1]-x[1]).map((x,i)=>`<tr class="cl" onclick="go('${x[2]}')"><td>#${i+1}</td><td>${E(x[0])}</td><td><b>${N(x[1])}</b></td><td>${bd(x[1])}</td></tr>`).join('')}</table></div>`:empty('Belum ada data');
function minForm(id){const m=S.m.find(x=>x.id==id)||{};dlg(`<h3>${id?'Ubah':'Tambah'} Kementerian</h3><label class="fl"><span>Nama kementerian *</span><input id="mn_n" value="${E(m.name)}"></label><label class="fl"><span>Kepala kementerian *</span><input id="mn_h" value="${E(m.head)}"></label><div class="er" id="mn_e"></div><div class="fb"><button class="bt" onclick="cd()">Batal</button><button class="bt p" onclick="minSave('${id||''}')">Simpan</button></div>`)}
function minSave(id){const n=$('#mn_n').value.trim(),h=$('#mn_h').value.trim();if(!n||!h)return $('#mn_e').textContent='Nama dan kepala kementerian wajib diisi.';if(S.m.some(m=>m.id!=id&&m.name.toLowerCase()==n.toLowerCase()))return $('#mn_e').textContent='Kementerian dengan nama ini sudah ada.';if(id){const m=S.m.find(x=>x.id==id);m.name=n;m.head=h;lg('Mengubah kementerian '+n)}else{S.m.push({id:uid(),name:n,head:h});lg('Menambahkan kementerian '+n)}save();cd();R(1);toast('Kementerian disimpan')}

if(!ps.length)return toast('Belum ada data untuk dilaporkan');const a=agg(ps),n=nar(a,scope=='all'?'Kabinet Samasta':ti.replace('Laporan ','')),A=ms.map(m=>[m,agg(pm(m.id))]);
let h=`<section class="cv"><img src="${LOGO}" alt=""><h1>Kabinet Samasta</h1><h2>${E(ti)}</h2><p>Periode ${E(S.cfg.periode||'-')}</p><p>Dicetak ${new Date().toLocaleDateString('id-ID',{dateStyle:'long'})}</p></section>`;
if(scope!='prk')h+=`<section><h2>Ringkasan Eksekutif</h2><p>Nilai keseluruhan <b>${N(a.fin)}</b> (${LB[li(a.fin)]}) dari ${a.n} proker: ${a.done} selesai, ${a.run} berjalan, ${a.todo} belum dimulai, ${a.fail} tidak terlaksana. Total penerima manfaat ${a.ben.toLocaleString('id-ID')}.</p>${narH(n)}<h2>Statistik</h2><div class="gr gs">${card(N(a.comp,0)+'%','Completion')}${card(N(a.ex,0)+'%','Execution')}${card(N(a.imp,0)+'%','Impact')}${card(N(a.sat,0)+'%','Satisfaction')}${card(N(a.okr,0)+'%','Strategic Alignment')}${card('Rp'+a.bud.toLocaleString('id-ID'),'Anggaran')}</div><h2>Grafik</h2><div class="gr"><div class="cd">${A.map(([m,x])=>bar(x.fin,E(m.name))).join('')}</div><div class="cd">${donut([{l:'Selesai',v:a.done,c:'#1E8E5A'},{l:'Berjalan',v:a.run,c:'#E0A800'},{l:'Belum dimulai',v:a.todo,c:'#8a979b'},{l:'Tidak terlaksana',v:a.fail,c:'#C93A3A'}])}</div><div class="cd">${radar(['Completion','Execution','Impact','Kepuasan','OKR'],[a.comp,a.ex,a.imp,a.sat,a.okr])}</div></div><h2>Ranking Kementerian</h2>${rkT(A.map(([m,x])=>[m.name,x.fin,'min/'+m.id]))}</section>`;
ms.forEach(m=>h+=`<section>${minBlock(m)}</section>`);ps.forEach(p=>h+=`<section>${prkBlock(p)}</section>`);
h+=`<section><h2>Kesimpulan</h2><p>Berdasarkan data yang dimasukkan, kinerja ${scope=='all'?'Kabinet Samasta':E(ti.replace('Laporan ',''))} berada pada kategori <b>${LB[li(a.fin)]}</b> dengan nilai ${N(a.fin)}. ${n&&n.r.length?'Prioritas perbaikan: '+n.r.join(' '):'Pertahankan kinerja dan konsistensi dokumentasi.'}</p></section>`;
$('#rpt').innerHTML=h;lg('Menghasilkan laporan: '+ti);setTimeout(()=>{window.print()},300)}
function P_rep(){const o=S.m.map(m=>[m.id,m.name]),p=S.p.map(x=>[x.id,x.name]);return`<h1>Laporan & Ekspor</h1><div class="gr"><div class="cd"><h3>Laporan PDF</h3><p>Klik, lalu pilih <b>Simpan sebagai PDF</b> pada dialog cetak.</p><button class="bt d" onclick="rpt('all')">Download Laporan PDF (keseluruhan)</button><label class="fl"><span>Per kementerian</span><select id="rm" onchange="this.value&&rpt('min',this.value)">${opt(o,'','Pilih kementerian…')}</select></label><label class="fl"><span>Per proker</span><select id="rp" onchange="this.value&&rpt('prk',this.value)">${opt(p,'','Pilih proker…')}</select></label></div><div class="cd"><h3>Ekspor data</h3><div class="fb"><button class="bt" onclick="dl('samasta-proker.csv',toCSV(rows()))">CSV Proker (buka di Excel)</button><button class="bt" onclick="dl('samasta-kpi.csv',toCSV(kRows()))">CSV KPI</button></div><h3>Backup & impor</h3><div class="fb"><button class="bt" onclick="dl('samasta-backup.json',JSON.stringify(S,null,1))">Backup JSON</button><button class="bt" onclick="$('#imp').click()">Impor backup</button></div><input id="imp" type="file" accept=".json" hidden onchange="impF(this.files[0])"></div></div>`}
function impF(f){if(!f)return;const r=new FileReader();r.onload=async()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.m)||!Array.isArray(d.p))throw 0;if(!await ask('Impor akan menggantikan seluruh data saat ini. Lanjutkan?'))return;S=d;S.cfg=S.cfg||{};lg('Impor data');save();R(1);toast('Data diimpor')}catch(e){toast('File backup tidak valid')}};r.readAsText(f)}
// ---------- settings, log ----------
function P_set(){const c=S.cfg,e=c.ex;const ni=(id,v)=>`<input id="s_${id}" type="number" min="0" max="100" value="${v}" oninput="sTot()">`;return`<h1>Pengaturan</h1><div class="gr"><div class="cd"><h3>Bobot Nilai Akhir</h3>${fl('Program Completion (%)',ni('wc',c.wc))}${fl('Execution Performance (%)',ni('we',c.we))}${fl('Impact & Satisfaction (%)',ni('wi',c.wi))}<p id="t1"></p></div><div class="cd"><h3>Bobot Execution</h3>${fl('KPI Achievement (%)',ni('kpi',e.kpi))}${fl('Target vs Realisasi (%)',ni('tvr',e.tvr))}${fl('Timeliness (%)',ni('time',e.time))}${fl('Quality (%)',ni('qual',e.qual))}${fl('Administrative Compliance (%)',ni('adm',e.adm))}<p id="t2"></p></div><div class="cd">${fl('Batas maksimum capaian KPI (%)',`<input id="s_cap" type="number" min="1" value="${c.cap}">`,'100 = capaian berlebih tidak menambah nilai')}${fl('Periode kepengurusan',`<input id="s_per" value="${E(c.periode)}" placeholder="2026/2027">`)}<button class="bt p" id="sv" onclick="sSave()">Simpan pengaturan</button> <button class="bt r" onclick="rst()">Hapus semua data</button><p style="color:var(--mu);font-size:.85rem">OKR Alignment ditampilkan terpisah sebagai indikator strategis dan tidak masuk bobot nilai akhir.</p></div></div>`}
const sv=i=>+$('#s_'+i).value||0;
function sTot(){const a=sv('wc')+sv('we')+sv('wi'),b=['kpi','tvr','time','qual','adm'].reduce((x,k)=>x+sv(k),0),t=(i,v)=>$(i).innerHTML=`Total: <b style="color:var(--c${v==100?0:4})">${v}%</b>${v==100?'':' — harus tepat 100%'}`;t('#t1',a);t('#t2',b);$('#sv').disabled=a!=100||b!=100}
async function sSave(){if(!await ask('Ubah bobot? Seluruh nilai akan dihitung ulang.'))return;S.cfg={wc:sv('wc'),we:sv('we'),wi:sv('wi'),ex:{kpi:sv('kpi'),tvr:sv('tvr'),time:sv('time'),qual:sv('qual'),adm:sv('adm')},cap:Math.max(1,sv('cap')),periode:$('#s_per').value.trim()};lg('Mengubah bobot penilaian');save();toast('Pengaturan disimpan')}
async function rst(){if(!await ask('Hapus SEMUA data kementerian dan proker? Backup dulu bila perlu.'))return;S.m=[];S.p=[];lg('Menghapus seluruh data');save();go('dash')}
const P_log=()=>`<h1>Audit Log</h1>${S.log.length?`<div class="cd ov"><table>${S.log.map(l=>`<tr><td>${new Date(l.t).toLocaleString('id-ID')}</td><td>${E(l.a)}</td></tr>`).join('')}</table></div>`:empty('Belum ada aktivitas.')}`;
// ---------- boot ----------
const PG={dash:P_dash,min:P_min,prk:P_prk,add:P_add,ana:P_ana,rank:P_rank,rep:P_rep,set:P_set,log:P_log};
function R(keep){if(!AU)return;const[pg,id]=(location.hash.slice(1)||'dash').split('/');document.querySelectorAll('#nv a').forEach(a=>a.classList.toggle('on',a.dataset.p==pg));$('#sb').classList.remove('o');let o;try{o=(PG[pg]||P_dash)(id)}catch(e){o=empty('Terjadi kesalahan: '+E(e.message))}$('#main').innerHTML=o;if(pg=='add'&&S.m.length)initForm(id);if(pg=='set')sTot();if(!keep)scrollTo(0,0)}
function boot(){document.querySelectorAll('.lg').forEach(i=>i.src=LOGO);$('#login').hidden=AU;$('#app').hidden=!AU;if(AU){$('#nv').innerHTML=NAV.map(n=>`<a data-p="${n[0]}" onclick="go('${n[0]}')">${ic(n[0])}${n[1]}</a>`).join('')+`<a onclick="logout()" style="margin-top:auto">${ic('out')}Keluar</a>`;R()}}
addEventListener('hashchange',()=>R());addEventListener('afterprint',()=>$('#rpt').innerHTML='');
$('#code').addEventListener('keydown',e=>e.key=='Enter'&&login());$('#gs').addEventListener('keydown',e=>{if(e.key=='Enter'){Q=e.target.value;TAB='';go('prk');R()}});
boot();
</script><script src="config.js"></script><script src="qr.js"></script><script src="audit-api.js"></script><script src="audit-sync.js"></script></body></html>
