<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Sistem Penilaian Kinerja Kabinet Samasta</title>
<style>
:root{--g:#E8B923;--gd:#9A7410;--t:#0F6B5A;--n:#0B2A3C;--bg:#FBF6E3;--cd:#fff;--tx:#1b2b33;--mu:#66767c;--bd:#EADFB5;--c0:#1E8E5A;--c1:#6FA83A;--c2:#E0A800;--c3:#E8742A;--c4:#C93A3A;--sh:0 1px 3px rgba(11,42,60,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1b22;--cd:#14272f;--tx:#eef2ee;--mu:#9fb0b6;--bd:#2a4350;--t:#3fb59f;--gd:#E8B923}}
[hidden]{display:none!important}html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}*{box-sizing:border-box}
body{margin:0;font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);min-height:100%}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0 0 .4em;color:var(--n);font-weight:600}@media(prefers-color-scheme:dark){h1,h2,h3{color:var(--g)}}
h1{font-size:1.7rem}h2{font-size:1.3rem}h3{font-size:1.05rem}p{margin:.3em 0}
.tx{fill:var(--tx)}a{color:var(--t)}
button,input,select,textarea{font:inherit;color:inherit}
.bt{min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--bd);background:var(--cd);cursor:pointer;font-weight:600}
.bt.p{background:linear-gradient(135deg,var(--g),#d9a516);border-color:transparent;color:#2b2100}.bt.d{background:var(--n);color:#fff;border-color:transparent}.bt.r{color:var(--c4);border-color:var(--c4)}.bt:disabled{opacity:.45;cursor:not-allowed}.bt.s{min-height:36px;padding:0 12px;font-size:.85rem}
input,select,textarea{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--cd)}textarea{min-height:80px}
:focus-visible{outline:2px solid var(--t);outline-offset:2px}
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 10%,rgba(232,185,35,.35),transparent 55%),radial-gradient(circle at 90% 90%,rgba(15,107,90,.25),transparent 50%)}
.lc{background:var(--cd);border:1px solid var(--bd);border-radius:20px;padding:28px;max-width:380px;width:100%;text-align:center;box-shadow:0 12px 40px rgba(11,42,60,.15)}.lc img{width:170px;border-radius:18px}.lc input{text-align:center;letter-spacing:.3em;margin:14px 0 8px}
.er{color:var(--c4);font-size:.9rem;min-height:1.3em}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
#sb{background:var(--n);color:#e9efe9;padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:2px}
#sb .lg{width:100%;max-width:150px;border-radius:14px;margin:0 auto 14px;display:block}
#sb a{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:10px;color:#cfdad6;text-decoration:none;cursor:pointer}#sb a.on{background:rgba(232,185,35,.18);color:var(--g)}#sb a:hover{background:rgba(255,255,255,.07)}
svg.i{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tb{display:flex;gap:10px;padding:12px 20px;align-items:center;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--bg);z-index:5}.tb button{display:none}
main{padding:20px;max-width:1200px}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:16px;box-shadow:var(--sh)}
.gr{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}.gs{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.kp b{display:block;font:600 1.7rem Georgia,serif;color:var(--n)}@media(prefers-color-scheme:dark){.kp b{color:var(--g)}}.kp span{color:var(--mu);font-size:.85rem}.kp.h{background:linear-gradient(135deg,rgba(232,185,35,.3),rgba(15,107,90,.18))}
.hd{display:flex;gap:14px;align-items:center;margin-bottom:16px;flex-wrap:wrap}.hd img{width:64px;border-radius:12px}.hd div{flex:1;min-width:200px}.hd p{color:var(--mu)}
.b{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:700;color:#fff;white-space:nowrap}
.f0{background:var(--c0)}.f1{background:var(--c1)}.f2{background:var(--c2);color:#2b2100}.f3{background:var(--c3)}.f4{background:var(--c4)}.f5{background:#8a979b}
.br{margin:8px 0}.bl{display:flex;justify-content:space-between;font-size:.88rem}.tk{height:9px;background:rgba(128,128,128,.18);border-radius:9px;overflow:hidden}.tk i{display:block;height:100%;border-radius:9px;transition:width .5s}
.ov{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.9rem}th,td{padding:9px 10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mu);font-weight:600;font-size:.8rem}tr.cl{cursor:pointer}tr.cl:hover{background:rgba(232,185,35,.1)}
.em{padding:28px;text-align:center;color:var(--mu);border:1px dashed var(--bd);border-radius:14px}
.fb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.fb select{width:auto;flex:1;min-width:140px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button{min-height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--bd);background:var(--cd);cursor:pointer}.tabs .on{background:var(--n);color:#fff}
.dn{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.dn ul{list-style:none;padding:0;margin:0}.dn li i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.rd{max-width:300px;width:100%;display:block;margin:auto}
.fl{display:block;margin:10px 0}.fl>span{display:block;font-size:.85rem;font-weight:600;margin-bottom:4px}.fl small{color:var(--mu)}
.steps{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}.steps button{flex:1;min-width:74px;min-height:40px;border-radius:10px;border:1px solid var(--bd);background:var(--cd);font-size:.8rem;cursor:pointer}.steps .on{background:var(--g);color:#2b2100;font-weight:700}
.stp{display:none}.stp.on{display:block}.kr{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr auto;gap:6px;margin-bottom:8px}
.wn{background:rgba(232,185,35,.2);border-left:4px solid var(--c2);padding:8px 12px;border-radius:8px;margin:8px 0;font-size:.9rem}.wn.x{background:rgba(201,58,58,.12);border-color:var(--c4)}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:16px;z-index:50}#dlg[hidden]{display:none}#dlg>div{background:var(--cd);border-radius:16px;padding:20px;max-width:440px;width:100%;max-height:90vh;overflow:auto}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:60;display:grid;gap:6px}#toast div{background:var(--n);color:#fff;padding:10px 16px;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#rpt{display:none}
@media(max-width:820px){.app{grid-template-columns:1fr}#sb{position:fixed;left:0;top:0;width:260px;z-index:40;transform:translateX(-105%);transition:transform .2s}#sb.o{transform:none}.tb button{display:block}main{padding:14px}.kr{grid-template-columns:1fr 1fr}.kr .kn{grid-column:1/-1}}
@media print{@page{size:A4;margin:18mm 14mm;@top-left{content:"Kabinet Samasta · Laporan Kinerja";font-size:9pt;color:#0F6B5A}@bottom-right{content:"Halaman " counter(page);font-size:9pt}}
body>*:not(#rpt){display:none!important}#rpt{display:block;color:#111;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-size:10.5pt}#rpt .cd{box-shadow:none;break-inside:avoid;margin-bottom:8px}#rpt section{break-before:page}#rpt section:first-child{break-before:auto}#rpt h1,#rpt h2,#rpt h3{color:#0B2A3C}#rpt .cv{text-align:center;padding-top:50mm}#rpt .cv img{width:60mm;border-radius:6mm}#rpt tr{break-inside:avoid}#rpt .tx{fill:#111}.gr{display:block}.gr>*{margin-bottom:8px}}
</style></head><body>
<div id="login" hidden><div class="lc"><img class="lg" alt="Logo Kabinet Samasta"><h2 style="margin-top:14px">Sistem Penilaian Kinerja</h2><p style="color:var(--mu)">Khusus admin Kabinet Samasta</p><input id="code" type="password" inputmode="numeric" autocomplete="off" placeholder="Kode akses" aria-label="Kode akses"><div class="er" id="er"></div><button class="bt p" style="width:100%" onclick="login()">Masuk</button></div></div>
<div class="app" id="app" hidden><aside id="sb"><img class="lg" alt="Kabinet Samasta"><div id="nv"></div></aside><div><header class="tb"><button class="bt s" onclick="$('#sb').classList.toggle('o')" aria-label="Menu">☰</button><input id="gs" placeholder="Cari kementerian, proker, penanggung jawab, KPI…" aria-label="Cari"></header><main id="main"></main></div></div>
<div id="dlg" hidden></div><div id="toast"></div><div id="rpt"></div>

function nar(a,nm){if(!a.n)return null;const ks=Object.keys(DIM).map(k=>[k,a[k]]).sort((x,y)=>y[1]-x[1]),top=ks.slice(0,2),low=ks.filter(x=>x[1]<75).reverse().slice(0,3);

function P_add(id){if(!S.m.length)return empty('Tambahkan kementerian terlebih dahulu.<p><button class="bt p" onclick="go(\'min\')">Ke halaman Kementerian</button></p>');
return`<div class="hd"><div><h1>${id?'Ubah':'Input'} Penilaian</h1><p>Isi bertahap. Nilai dihitung otomatis setelah disimpan.${id?'':' Draft tersimpan otomatis.'}</p></div></div><div class="steps">${STT.map((s,i)=>`<button id="sp${i}" onclick="step(${i})">${i+1}. ${s}</button>`).join('')}</div><div class="cd"><div class="stp" id="s0">${fl('Nama proker *',fi('name'))}${fl('Kementerian *',`<select id="f_mid">${opt(S.m.map(m=>[m.id,m.name]),'')}</select>`)}${fl('Penanggung jawab *',fi('pic'))}${fl('Tanggal pelaksanaan *',fi('date','date'))}${fl('Periode (bulan)',fi('period','month'),'Dipakai untuk grafik perkembangan')}${fl('Jenis proker',fi('type','text','list="tl"'),'Contoh: Seminar, Pengabdian, Advokasi')}<datalist id="tl">${uq('type').map(t=>`<option value="${E(t)}">`).join('')}</datalist>${fl('Status',`<select id="f_status">${opt(Object.keys(SF),'')}</select>`)}${fl('Bobot proker (1–5)',`<select id="f_weight">${opt([[1,'1 · Kecil'],[2,'2'],[3,'3 · Sedang'],[4,'4'],[5,'5 · Besar']],3)}</select>`,'Proker besar berpengaruh lebih besar pada nilai kementerian')}${fl('Anggaran (Rp)',fi('budget','number','min=0'))}</div>
<div class="stp" id="s1">${fl('Objective *',fi('obj','text','list="ol"'),'Contoh: Meningkatkan keterlibatan mahasiswa')}<datalist id="ol">${uq('obj').map(t=>`<option value="${E(t)}">`).join('')}</datalist>${fl('Key Result',fi('kr'))}${fl('Kontribusi proker terhadap OKR (0–100) *',fi('okr','number','min=0 max=100'),'Seberapa relevan proker ini dengan tujuan strategis')}</div>
<div class="stp" id="s2"><p>Total bobot KPI harus 100%.</p><div class="kr" style="font-size:.78rem;color:var(--mu)"><span>Nama KPI</span><span>Satuan</span><span>Target</span><span>Realisasi</span><span>Bobot %</span><span></span></div><div id="kl"></div><button class="bt s" onclick="addK()">+ Tambah KPI</button><p id="kw" style="margin-top:8px"></p></div>
<div class="stp" id="s3">${fl('Ketepatan waktu (0–100)',fi('time','number','min=0 max=100'))}${fl('Kualitas pelaksanaan (0–100)',fi('qual','number','min=0 max=100'))}${fl('Kepatuhan administrasi (0–100)',fi('adm','number','min=0 max=100'),'LPJ, laporan, kelengkapan dokumen')}</div>
<div class="stp" id="s4">${fl('Jumlah penerima manfaat',fi('benef','number','min=0'))}${fl('Impact score (0–100)',fi('impact','number','min=0 max=100'))}${fl('Outcome / perubahan yang dihasilkan',fi('outcome'))}${fl('Kepuasan peserta (skala 1–5)',fi('sat','number','min=0 max=5 step=0.1'),'1 Sangat Tidak Puas · 3 Cukup · 5 Sangat Puas. Dikonversi otomatis ke skala 100.')}</div>
<div class="stp" id="s5">${fl('Bukti / Evidence (satu link atau nama dokumen per baris)','<textarea id="f_evidence" placeholder="LPJ: https://…\nDokumentasi: …"></textarea>')}${fl('Catatan audit','<textarea id="f_note"></textarea>')}</div>
<div class="er" id="fe"></div><div class="fb" style="margin-top:12px"><button class="bt" id="bp" onclick="step(ST-1)">Kembali</button><button class="bt p" id="bn" onclick="step(ST+1)">Lanjut</button><button class="bt d" id="bs" onclick="fsave()">Simpan & hitung nilai</button></div></div>`}
function addK(k={}){const d=document.createElement('div');d.className='kr';d.innerHTML=`<input class="kn" placeholder="Nama KPI" value="${E(k.n)}"><input class="ku" placeholder="Satuan" value="${E(k.u)}"><input class="kt" type="number" min="0" placeholder="Target" value="${k.t??''}"><input class="kv" type="number" min="0" placeholder="Realisasi" value="${k.r??''}"><input class="kw" type="number" min="0" max="100" placeholder="Bobot" value="${k.w??''}"><button class="bt s r" onclick="this.parentNode.remove();kwt()" aria-label="Hapus KPI">✕</button>`;$('#kl').append(d)}
const kwt=()=>{const t=[...document.querySelectorAll('.kw')].reduce((a,i)=>a+(+i.value||0),0);$('#kw').innerHTML=`Total bobot KPI: <b style="color:var(--c${t==100?0:4})">${t}%</b>`};
function step(i){if(i<0||i>5)return;ST=i;document.querySelectorAll('.stp').forEach((s,j)=>s.classList.toggle('on',j==i));STT.forEach((_,j)=>$('#sp'+j).classList.toggle('on',j==i));$('#bp').hidden=i==0;$('#bn').hidden=i==5;$('#bs').hidden=i!=5;kwt()}
const DK='samasta_draft';
function collect(){const g=i=>$('#f_'+i).value.trim(),n=i=>g(i)===''?NaN:+g(i);return{id:EDIT||uid(),name:g('name'),mid:g('mid'),pic:g('pic'),date:g('date'),status:g('status'),weight:+g('weight'),type:g('type'),period:g('period'),budget:+g('budget')||0,obj:g('obj'),kr:g('kr'),okr:n('okr'),kpis:[...document.querySelectorAll('.kr')].filter(r=>r.querySelector('.kn')).map(r=>({n:r.querySelector('.kn').value.trim(),u:r.querySelector('.ku').value.trim(),t:+r.querySelector('.kt').value,r:+r.querySelector('.kv').value,w:+r.querySelector('.kw').value})),time:n('time'),qual:n('qual'),adm:n('adm'),benef:+g('benef')||0,impact:n('impact'),outcome:g('outcome'),sat:+g('sat')||0,evidence:$('#f_evidence').value.trim(),note:g('note')}}
function fill(p){['name','mid','pic','date','status','weight','type','period','budget','obj','kr','okr','time','qual','adm','benef','impact','outcome','sat','evidence','note'].forEach(k=>{const v=p[k];$('#f_'+k).value=(v==null||Number.isNaN(v))?'':v});$('#kl').innerHTML='';(p.kpis&&p.kpis.length?p.kpis:[{}]).forEach(addK)}
function initForm(id){EDIT=id||null;const f=$('#main');if(id){fill(S.p.find(p=>p.id==id))}else{let d;try{d=JSON.parse(localStorage.getItem(DK))}catch(e){}if(d&&d.name){fill(d);toast('Draft dipulihkan')}else fill({status:'Belum dimulai',weight:3})}
f.oninput=()=>{kwt();if(!EDIT)try{localStorage.setItem(DK,JSON.stringify(collect()))}catch(e){}};step(0)}
function validate(p){const e=[],r=(v,a,b)=>!Number.isNaN(v)&&v>=a&&v<=b;if(!p.name)e.push('Nama proker wajib diisi.');if(!p.mid)e.push('Pilih kementerian.');if(!p.pic)e.push('Penanggung jawab wajib diisi.');if(!p.date)e.push('Tanggal wajib diisi.');if(!p.obj)e.push('Objective OKR wajib diisi.');if(!r(p.weight,1,5))e.push('Bobot proker harus 1–5.');if(!r(p.okr,0,100))e.push('Kontribusi OKR harus 0–100.');
if(!p.kpis.length)e.push('Minimal satu KPI.');p.kpis.forEach((k,i)=>{if(!k.n)e.push(`KPI ${i+1}: nama wajib diisi.`);if(!(k.t>0))e.push(`KPI ${i+1}: target harus lebih dari 0.`);if(k.r<0)e.push(`KPI ${i+1}: realisasi tidak boleh negatif.`);if(!(k.w>0))e.push(`KPI ${i+1}: bobot harus lebih dari 0.`)});const tw=p.kpis.reduce((a,k)=>a+k.w,0);if(p.kpis.length&&Math.round(tw*100)!=10000)e.push(`Total bobot KPI harus 100% (saat ini ${tw}%).`);
[['time','Ketepatan waktu'],['qual','Kualitas'],['adm','Administrasi'],['impact','Impact']].forEach(([k,l])=>{if(!r(p[k],0,100))e.push(l+' harus diisi 0–100.')});if(p.benef<0||p.budget<0)e.push('Penerima manfaat dan anggaran tidak boleh negatif.');if(['Selesai','Berjalan'].includes(p.status)?!r(p.sat,1,5):!r(p.sat,0,5))e.push('Kepuasan harus 1–5.');
if(S.p.some(x=>x.id!=p.id&&x.mid==p.mid&&x.name.toLowerCase()==p.name.toLowerCase()))e.push('Proker dengan nama yang sama sudah ada di kementerian ini.');return e}
async function fsave(){const p=collect(),e=validate(p);if(e.length){$('#fe').innerHTML=e.map(x=>'• '+E(x)).join('<br>');return}$('#fe').textContent='';if(EDIT&&!await ask('Ubah data dan nilai proker ini?'))return;if(EDIT){S.p[S.p.findIndex(x=>x.id==EDIT)]=p;lg('Mengubah nilai/data proker '+p.name)}else{S.p.push(p);lg('Menambahkan proker '+p.name);try{localStorage.removeItem(DK)}catch(e){}}save();toast('Tersimpan. Nilai dihitung otomatis.');go('prk/'+p.id)}
// ---------- analytics, ranking ----------
function P_ana(){if(!S.p.length)return empty('Belum ada data untuk dianalisis.');const a=agg(S.p),n=nar(a,'Kabinet Samasta'),ds=Object.keys(DIM).map(k=>[DIM[k],a[k]]).sort((x,y)=>x[1]-y[1]),ty={};S.p.forEach(p=>(ty[p.type||'Tanpa jenis']=ty[p.type||'Tanpa jenis']||[]).push(p));
return`<h1>Analitik</h1><div class="gr"><div class="cd"><h3>Analisis Kabinet</h3>${narH(n)}</div><div class="cd"><h3>Indikator dari terlemah</h3>${ds.map(d=>bar(d[1],d[0])).join('')}</div><div class="cd"><h3>Nilai per Jenis Proker</h3>${Object.entries(ty).map(([k,v])=>bar(agg(v).fin,E(k)+' ('+v.length+')')).join('')}</div><div class="cd"><h3>Temuan Audit</h3>${S.p.flatMap(p=>warns(p).map(w=>`<div class="wn"><b>${E(p.name)}</b>: ${w}</div>`)).join('')||'<p>Tidak ada temuan.</p>'}</div></div>`}
const RM=[['fin','Nilai akhir'],['comp','Completion'],['ex','Execution'],['imp','Impact'],['sat','Satisfaction']];let RK='fin';
function P_rank(){if(!S.p.length)return empty('Belum ada data untuk diranking.');return`<h1>Ranking</h1><p style="color:var(--mu)">Ranking untuk evaluasi dan pembelajaran, bukan sekadar kompetisi.</p><div class="tabs">${RM.map(m=>`<button class="${RK==m[0]?'on':''}" onclick="RK='${m[0]}';R(1)">${m[1]}</button>`).join('')}</div><div class="gr"><div class="cd"><h3>Kementerian</h3>${rkT(S.m.filter(m=>pm(m.id).length).map(m=>[m.name,agg(pm(m.id))[RK],'min/'+m.id]))}</div><div class="cd"><h3>Program Kerja</h3>${rkT(S.p.map(p=>[p.name,sc(p)[RK],'prk/'+p.id]))}</div></div>`}
// ---------- report, export ----------
function rows(){return S.p.map(p=>{const s=sc(p);return{Kementerian:mn(p.mid),Proker:p.name,'Penanggung Jawab':p.pic,Tanggal:p.date,Periode:p.period,Jenis:p.type,Status:p.status,Bobot:p.weight,Objective:p.obj,'Key Result':p.kr,Completion:N(s.comp,2),KPI:N(s.kpi,2),'Target-Realisasi':N(s.tvr,2),Ketepatan:p.time,Kualitas:p.qual,Administrasi:p.adm,Execution:N(s.ex,2),Impact:p.impact,'Kepuasan (1-5)':p.sat,'Kepuasan (100)':N(s.sat,2),OKR:p.okr,'Nilai Akhir':N(s.fin,2),Level:LB[li(s.fin)],'Penerima Manfaat':p.benef,Anggaran:p.budget}})}
function kRows(){return S.p.flatMap(p=>p.kpis.map(k=>({Kementerian:mn(p.mid),Proker:p.name,KPI:k.n,Satuan:k.u,Target:k.t,Realisasi:k.r,Bobot:k.w,Capaian:N(ach(k),2)})))}
const toCSV=r=>r.length?'\ufeff'+[Object.keys(r[0]),...r.map(o=>Object.values(o))].map(a=>a.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'):'';
async function dl(name,data){if(!data)return toast('Belum ada data untuk diekspor');try{let d=null;try{d=await claude.use('downloads')}catch(e){}if(d)await d.save({filename:name,data});else{const u=URL.createObjectURL(new Blob([data],{type:'text/plain;charset=utf-8'})),x=document.createElement('a');x.href=u;x.download=name;document.body.append(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}lg('Ekspor '+name)}catch(e){if(e&&e.code!='declined')toast('Gagal menyimpan file')}}
function rpt(scope,id){let ps=S.p,ms=S.m.filter(m=>pm(m.id).length),ti='Laporan Kinerja Kabinet Samasta';if(scope=='min'){const m=S.m.find(x=>x.id==id);ms=[m];ps=pm(id);ti='Laporan Kementerian '+m.name}if(scope=='prk'){const p=S.p.find(x=>x.id==id);ps=[p];ms=[];ti='Laporan Proker '+p.name}
if(!ps.length)return toast('Belum ada data untuk dilaporkan');const a=agg(ps),n=nar(a,scope=='all'?'Kabinet Samasta':ti.replace('Laporan ','')),A=ms.map(m=>[m,agg(pm(m.id))]);
let h=`<section class="cv"><img src="${LOGO}" alt=""><h1>Kabinet Samasta</h1><h2>${E(ti)}</h2><p>Periode ${E(S.cfg.periode||'-')}</p><p>Dicetak ${new Date().toLocaleDateString('id-ID',{dateStyle:'long'})}</p></section>`;
if(scope!='prk')h+=`<section><h2>Ringkasan Eksekutif</h2><p>Nilai keseluruhan <b>${N(a.fin)}</b> (${LB[li(a.fin)]}) dari ${a.n} proker: ${a.done} selesai, ${a.run} berjalan, ${a.todo} belum dimulai, ${a.fail} tidak terlaksana. Total penerima manfaat ${a.ben.toLocaleString('id-ID')}.</p>${narH(n)}<h2>Statistik</h2><div class="gr gs">${card(N(a.comp,0)+'%','Completion')}${card(N(a.ex,0)+'%','Execution')}${card(N(a.imp,0)+'%','Impact')}${card(N(a.sat,0)+'%','Satisfaction')}${card(N(a.okr,0)+'%','Strategic Alignment')}${card('Rp'+a.bud.toLocaleString('id-ID'),'Anggaran')}</div><h2>Grafik</h2><div class="gr"><div class="cd">${A.map(([m,x])=>bar(x.fin,E(m.name))).join('')}</div><div class="cd">${donut([{l:'Selesai',v:a.done,c:'#1E8E5A'},{l:'Berjalan',v:a.run,c:'#E0A800'},{l:'Belum dimulai',v:a.todo,c:'#8a979b'},{l:'Tidak terlaksana',v:a.fail,c:'#C93A3A'}])}</div><div class="cd">${radar(['Completion','Execution','Impact','Kepuasan','OKR'],[a.comp,a.ex,a.imp,a.sat,a.okr])}</div></div><h2>Ranking Kementerian</h2>${rkT(A.map(([m,x])=>[m.name,x.fin,'min/'+m.id]))}</section>`;
ms.forEach(m=>h+=`<section>${minBlock(m)}</section>`);ps.forEach(p=>h+=`<section>${prkBlock(p)}</section>`);
h+=`<section><h2>Kesimpulan</h2><p>Berdasarkan data yang dimasukkan, kinerja ${scope=='all'?'Kabinet Samasta':E(ti.replace('Laporan ',''))} berada pada kategori <b>${LB[li(a.fin)]}</b> dengan nilai ${N(a.fin)}. ${n&&n.r.length?'Prioritas perbaikan: '+n.r.join(' '):'Pertahankan kinerja dan konsistensi dokumentasi.'}</p></section>`;
$('#rpt').innerHTML=h;lg('Menghasilkan laporan: '+ti);setTimeout(()=>{window.print()},300)}
function P_rep(){const o=S.m.map(m=>[m.id,m.name]),p=S.p.map(x=>[x.id,x.name]);return`<h1>Laporan & Ekspor</h1><div class="gr"><div class="cd"><h3>Laporan PDF</h3><p>Klik, lalu pilih <b>Simpan sebagai PDF</b> pada dialog cetak.</p><button class="bt d" onclick="rpt('all')">Download Laporan PDF (keseluruhan)</button><label class="fl"><span>Per kementerian</span><select id="rm" onchange="this.value&&rpt('min',this.value)">${opt(o,'','Pilih kementerian…')}</select></label><label class="fl"><span>Per proker</span><select id="rp" onchange="this.value&&rpt('prk',this.value)">${opt(p,'','Pilih proker…')}</select></label></div><div class="cd"><h3>Ekspor data</h3><div class="fb"><button class="bt" onclick="dl('samasta-proker.csv',toCSV(rows()))">CSV Proker (buka di Excel)</button><button class="bt" onclick="dl('samasta-kpi.csv',toCSV(kRows()))">CSV KPI</button></div><h3>Backup & impor</h3><div class="fb"><button class="bt" onclick="dl('samasta-backup.json',JSON.stringify(S,null,1))">Backup JSON</button><button class="bt" onclick="$('#imp').click()">Impor backup</button></div><input id="imp" type="file" accept=".json" hidden onchange="impF(this.files[0])"></div></div>`}
function impF(f){if(!f)return;const r=new FileReader();r.onload=async()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.m)||!Array.isArray(d.p))throw 0;if(!await ask('Impor akan menggantikan seluruh data saat ini. Lanjutkan?'))return;S=d;S.cfg=S.cfg||{};lg('Impor data');save();R(1);toast('Data diimpor')}catch(e){toast('File backup tidak valid')}};r.readAsText(f)}
// ---------- settings, log ----------
function P_set(){const c=S.cfg,e=c.ex;const ni=(id,v)=>`<input id="s_${id}" type="number" min="0" max="100" value="${v}" oninput="sTot()">`;return`<h1>Pengaturan</h1><div class="gr"><div class="cd"><h3>Bobot Nilai Akhir</h3>${fl('Program Completion (%)',ni('wc',c.wc))}${fl('Execution Performance (%)',ni('we',c.we))}${fl('Impact & Satisfaction (%)',ni('wi',c.wi))}<p id="t1"></p></div><div class="cd"><h3>Bobot Execution</h3>${fl('KPI Achievement (%)',ni('kpi',e.kpi))}${fl('Target vs Realisasi (%)',ni('tvr',e.tvr))}${fl('Timeliness (%)',ni('time',e.time))}${fl('Quality (%)',ni('qual',e.qual))}${fl('Administrative Compliance (%)',ni('adm',e.adm))}<p id="t2"></p></div><div class="cd">${fl('Batas maksimum capaian KPI (%)',`<input id="s_cap" type="number" min="1" value="${c.cap}">`,'100 = capaian berlebih tidak menambah nilai')}${fl('Periode kepengurusan',`<input id="s_per" value="${E(c.periode)}" placeholder="2026/2027">`)}<button class="bt p" id="sv" onclick="sSave()">Simpan pengaturan</button> <button class="bt r" onclick="rst()">Hapus semua data</button><p style="color:var(--mu);font-size:.85rem">OKR Alignment ditampilkan terpisah sebagai indikator strategis dan tidak masuk bobot nilai akhir.</p></div></div>`}
const sv=i=>+$('#s_'+i).value||0;
function sTot(){const a=sv('wc')+sv('we')+sv('wi'),b=['kpi','tvr','time','qual','adm'].reduce((x,k)=>x+sv(k),0),t=(i,v)=>$(i).innerHTML=`Total: <b style="color:var(--c${v==100?0:4})">${v}%</b>${v==100?'':' — harus tepat 100%'}`;t('#t1',a);t('#t2',b);$('#sv').disabled=a!=100||b!=100}
async function sSave(){if(!await ask('Ubah bobot? Seluruh nilai akan dihitung ulang.'))return;S.cfg={wc:sv('wc'),we:sv('we'),wi:sv('wi'),ex:{kpi:sv('kpi'),tvr:sv('tvr'),time:sv('time'),qual:sv('qual'),adm:sv('adm')},cap:Math.max(1,sv('cap')),periode:$('#s_per').value.trim()};lg('Mengubah bobot penilaian');save();toast('Pengaturan disimpan')}
async function rst(){if(!await ask('Hapus SEMUA data kementerian dan proker? Backup dulu bila perlu.'))return;S.m=[];S.p=[];lg('Menghapus seluruh data');save();go('dash')}
const P_log=()=>`<h1>Audit Log</h1>${S.log.length?`<div class="cd ov"><table>${S.log.map(l=>`<tr><td>${new Date(l.t).toLocaleString('id-ID')}</td><td>${E(l.a)}</td></tr>`).join('')}</table></div>`:empty('Belum ada aktivitas.')}`;
// ---------- boot ----------
const PG={dash:P_dash,min:P_min,prk:P_prk,add:P_add,ana:P_ana,rank:P_rank,rep:P_rep,set:P_set,log:P_log};
function R(keep){if(!AU)return;const[pg,id]=(location.hash.slice(1)||'dash').split('/');document.querySelectorAll('#nv a').forEach(a=>a.classList.toggle('on',a.dataset.p==pg));$('#sb').classList.remove('o');let o;try{o=(PG[pg]||P_dash)(id)}catch(e){o=empty('Terjadi kesalahan: '+E(e.message))}$('#main').innerHTML=o;if(pg=='add'&&S.m.length)initForm(id);if(pg=='set')sTot();if(!keep)scrollTo(0,0)}
function boot(){document.querySelectorAll('.lg').forEach(i=>i.src=LOGO);$('#login').hidden=AU;$('#app').hidden=!AU;if(AU){$('#nv').innerHTML=NAV.map(n=>`<a data-p="${n[0]}" onclick="go('${n[0]}')">${ic(n[0])}${n[1]}</a>`).join('')+`<a onclick="logout()" style="margin-top:auto">${ic('out')}Keluar</a>`;R()}}
addEventListener('hashchange',()=>R());addEventListener('afterprint',()=>$('#rpt').innerHTML='');
$('#code').addEventListener('keydown',e=>e.key=='Enter'&&login());$('#gs').addEventListener('keydown',e=>{if(e.key=='Enter'){Q=e.target.value;TAB='';go('prk');R()}});
boot();
</script></body></html>
